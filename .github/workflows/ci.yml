on:
  pull_request:
  push: # Run CI on the main branch after every merge. This is important to fill the GitHub Actions cache in a way that pull requests can see it
    branches:
      - main
  workflow_dispatch:

name: continuous-integration

permissions:
  contents: read

env:
  TERM: xterm-256color

jobs:
  build-lint-test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        rust:
          - stable
        # Test each supported feature set separately as well as all features together.
        style: [bashisms, default, sqlite, basqlite, external_printer, system_clipboard, all-features]
        include:
          - style: bashisms
            flags: "--features=bashisms"
          - style: external_printer
            flags: "--features=external_printer"
          - style: default
            flags: "--features="
          - style: sqlite
            flags: "--features=sqlite"
          - style: basqlite
            flags: "--features=bashisms,sqlite"
          - style: system_clipboard
            flags: "--features=system_clipboard"
          - style: all-features
            flags: "--all-features"
    runs-on: ${{ matrix.platform }}
    env:
      FEATURE_FLAG: ${{ matrix.flags }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
          cache-key: ${{ matrix.style }}

      - name: Setup nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --workspace "$FEATURE_FLAG" -- -D warnings

      - name: Tests
        id: tests
        run: cargo nextest run --locked --workspace --no-fail-fast "$FEATURE_FLAG"

      - name: Doctests
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: cargo test --doc --locked "$FEATURE_FLAG"

      - name: Check for clean repo
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "there are changes";
            git status --porcelain
            exit 1
          else
            echo "no changes in working directory";
          fi

      - name: Check lockfile
        run: cargo check --locked --all-targets --workspace "$FEATURE_FLAG"

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps "$FEATURE_FLAG"

  # Guards the `rust-version` claim in Cargo.toml, compiling the library as a
  # consumer on the MSRV would. Kept as a CI job instead of a rust-toolchain.toml
  # on purpose; everything else floats on stable.
  msrv-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain (MSRV)
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: "1.95"

      - name: Check the library builds on the MSRV
        run: cargo check --locked --all-features
